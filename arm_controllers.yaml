arm_controller:
  type: position_controllers/JointTrajectoryController

  joints:
    - shoulder_pitch_joint
    - shoulder_roll_joint
    - elbow_joint
    - wrist_joint
    - gripper_joint

  gains:
    shoulder_pitch_joint: {p: 120, d: 2, i: 0}
    shoulder_roll_joint: {p: 120, d: 2, i: 0}
    elbow_joint: {p: 100, d: 2, i: 0}
    wrist_joint: {p: 80, d: 1, i: 0}
    gripper_joint: {p: 50, d: 0.5, i: 0}

  constraints:
    goal_time: 0.6
    stopped_velocity_tolerance: 0.05

  state_publish_rate: 50
  action_monitor_rate: 10


joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50
